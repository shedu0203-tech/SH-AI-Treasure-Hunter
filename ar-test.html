<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1">
<title>SH AR TEST</title>

<style>
body {
  margin: 0;
  background: #101827;
  color: white;
  font-family: sans-serif;
  text-align: center;
}
h2 {
  margin-top: 50px;
}
</style>
  <script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
  </script>
</head>

<body>
<div id="intro">
  <h2>SH AI 트레저헌터</h2>
  <p>AR 시작 후 바닥을 비춰주세요.</p>
</div>
<div id="missionBox" style="
  display:none;
  position:fixed;
  bottom:12%;
  left:5%;
  width:90%;
  box-sizing:border-box;
  background:rgba(10,20,40,0.92);
  color:white;
  padding:20px;
  border:2px solid #00e5ff;
  border-radius:20px;
  z-index:9999;
  box-shadow:0 0 25px #00e5ff66;
">
  <div style="color:#00e5ff;font-size:12px;letter-spacing:3px;">
    SH AI TREASURE HUNTER
  </div>
  <h3 style="color:#ffd700;">
    🎯 NEW MISSION
  </h3>
  <p>안녕! 나를 찾았구나.</p>
  <p>이제 미션을 시작해 볼까?</p>
  <button id="startMission" style="
  width:100%;
  padding:15px;
  margin-top:10px;
  background:#00e5ff;
  color:#101827;
  border:none;
  border-radius:12px;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
">
  ▶ 미션 시작하기
  </button>
</div>
<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

import { ARButton } from
'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/webxr/ARButton.js';
import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';
const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 3));
const camera = new THREE.PerspectiveCamera(
  70, innerWidth / innerHeight, 0.01, 20
);

const renderer = new THREE.WebGLRenderer({
  alpha: true,
  antialias: true
});

renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
renderer.xr.addEventListener('sessionstart', () => {
  document.getElementById('intro').style.display = 'none';
});

renderer.xr.addEventListener('sessionend', () => {
  document.getElementById('intro').style.display = 'block';
  document.getElementById('missionBox').style.display = 'none';
});
document.body.appendChild(renderer.domElement);

document.body.appendChild(
  ARButton.createButton(renderer, {
    requiredFeatures: ['hit-test'],
optionalFeatures: ['dom-overlay'],
domOverlay: { root: document.body }
  })
);

const ring = new THREE.Mesh(
  new THREE.RingGeometry(0.12, 0.15, 32)
    .rotateX(-Math.PI / 2),
  new THREE.MeshBasicMaterial({
    color: 0x00ff88
  })
);

ring.matrixAutoUpdate = false;
ring.visible = false;
scene.add(ring);

let hitSource = null;
let requested = false;
let characterSpawned = false;
let activeCharacter = null;
const controller = renderer.xr.getController(0);

  function spawnCharacter() {
  if (!ring.visible || characterSpawned) return;
characterSpawned = true;

  const loader = new GLTFLoader();
const position = new THREE.Vector3();
position.setFromMatrixPosition(ring.matrix);

loader.load('./sh-character.glb', (gltf) => {
  const character = gltf.scene;
  character.position.copy(position);
  character.scale.setScalar(0.5);
  scene.add(character);
  activeCharacter = character;
  if (gltf.animations.length > 0) {
  const mixer = new THREE.AnimationMixer(character);
  mixers.push(mixer);
  mixer.clipAction(gltf.animations[0]).play();
  }
}, undefined, (error) => {
  console.error('캐릭터 로딩 오류:', error);
  characterSpawned = false;
});
}
controller.addEventListener('select', () => {
  if (!activeCharacter) return;

    if (activeCharacter) {
    console.log('캐릭터 터치 성공');
    if (!activeCharacter.userData.idleLoading) {
  activeCharacter.userData.idleLoading = true;
  const loader = new GLTFLoader();

  loader.load('./sh_idle.glb', (gltf) => {
    const idle = gltf.scene;
    idle.position.copy(activeCharacter.position);
    idle.rotation.copy(activeCharacter.rotation);
    idle.scale.copy(activeCharacter.scale);

    mixers.forEach(m => m.stopAllAction());
    mixers.length = 0;

    scene.remove(activeCharacter);
    scene.add(idle);
    activeCharacter = idle;
    idle.userData.idleLoading = true;

    if (gltf.animations.length > 0) {
      const mixer = new THREE.AnimationMixer(idle);
      mixers.push(mixer);
      mixer.clipAction(gltf.animations[0]).play();
    }
  }, undefined, (error) => {
    activeCharacter.userData.idleLoading = false;
    console.error(error);
  });
    }
    const speech = new SpeechSynthesisUtterance(
  '안녕! 나를 찾았구나. 이제 미션을 시작해 볼까?'
);
speech.lang = 'ko-KR';
window.speechSynthesis.speak(speech);
      document.getElementById('missionBox').style.display = 'block';
  }
});
scene.add(controller);
const mixers = [];
const clock = new THREE.Clock();
renderer.setAnimationLoop((time, frame) => {
  const delta = clock.getDelta();
mixers.forEach(mixer => mixer.update(delta));
  if (frame) {
    const session = renderer.xr.getSession();
    const space = renderer.xr.getReferenceSpace();

    if (!requested) {
      requested = true;

      session.requestReferenceSpace('viewer')
        .then(viewer => session.requestHitTestSource({
          space: viewer
        }))
        .then(source => {
          hitSource = source;
        })
        .catch(console.error);

      session.addEventListener('end', () => {
        requested = false;
        hitSource = null;
        ring.visible = false;
      }, { once: true });
    }

    if (hitSource) {
      const results = frame.getHitTestResults(hitSource);

      if (results.length) {
        const pose = results[0].getPose(space);
        ring.visible = !!pose;

        if (pose) {
          ring.matrix.fromArray(pose.transform.matrix);
          spawnCharacter();
ring.visible = false;
        }
      } else {
        ring.visible = false;
      }
    }
  }

  renderer.render(scene, camera);
});
  const startButton = document.getElementById('startMission');

startButton.addEventListener('beforexrselect', (event) => {
  event.preventDefault();
});

startButton.addEventListener('click', async () => {
  try {
    const response = await fetch('/api/config');
    if (!response.ok) throw new Error('API 오류');
    const data = await response.json();

    const missionId = Number(
      new URLSearchParams(location.search).get('mission') || 1
    );

    const mission = data.missions.find(
      m => m.id === missionId
    );

    if (!mission) throw new Error('미션 없음');

    const box = document.getElementById('missionBox');

    box.innerHTML = `
      <h3 style="color:#ffd700;">🎯 MISSION ${missionId}</h3>
      <h2 id="missionTitle"></h2>
      <p id="missionText"></p>
    `;

    document.getElementById('missionTitle').textContent = mission.title;
    document.getElementById('missionText').textContent = mission.description;

    const speech = new SpeechSynthesisUtterance(
      mission.title + '. ' + mission.description
    );

    speech.lang = 'ko-KR';
    speech.rate = 0.95;

    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(speech);

  } catch (error) {
    alert('미션을 불러오지 못했습니다.');
  }
});
</script>
</body>
</html>
