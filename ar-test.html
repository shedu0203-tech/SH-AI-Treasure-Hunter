<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1">
<title>SH AR TEST</title>

<style>
body {
  margin: 0;
  background: #101827;
  color: white;
  font-family: sans-serif;
  text-align: center;
}
h2 {
  margin-top: 50px;
}
#missionBox{bottom:5% !important;border-color:#eac36b !important;background:linear-gradient(145deg,#14283eeb,#091522f5)!important;box-shadow:0 0 25px #eac36b44!important} #missionBox h2{margin:10px 0} #missionBox button:disabled{opacity:.55} #missionBox p{line-height:1.6} #startMission{background:linear-gradient(135deg,#ffe4a0,#c99538)!important}

#missionBox{ text-align:left; bottom: max(12px, env(safe-area-inset-bottom)) !important; padding:18px !important; border-radius:22px !important; max-height:48dvh; overflow:auto; font-family:system-ui,sans-serif; }
#missionBox h3{font-size:12px;letter-spacing:2px;margin:6px 0;color:#ffdb83} #missionBox p{font-size:18px;font-weight:700;white-space:pre-wrap;margin:12px 0;color:#fff8e7} #missionBox button{width:100%;padding:14px;border:0;border-radius:12px;background:linear-gradient(135deg,#ffe5a0,#d69b38);color:#14243a;font-weight:900;font-size:16px} #missionBox input{box-sizing:border-box;width:100%!important;border-radius:12px;border:1px solid #d6b66c;background:#fff;color:#14243a;margin:8px 0;font-size:16px} #missionBox h2{font-size:21px;color:#ffe5a0} #discovery{display:none;position:fixed;top:18%;left:5%;width:90%;z-index:9998;pointer-events:none;color:#ffe49a;text-shadow:0 2px 12px #352000,0 0 24px #ffb62d;font-size:30px;font-weight:1000;letter-spacing:1px} #discovery.on{display:block;animation:discover 1.7s both} @keyframes discover{0%{opacity:0;transform:scale(.65)} 22%{opacity:1;transform:scale(1.08)} 75%{opacity:1;transform:scale(1)} 100%{opacity:0;transform:translateY(-12px)}} #missionBox.open{animation:dialogIn .35s ease-out} @keyframes dialogIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}

body.briefing{background:radial-gradient(ellipse at 50% 25%,#354b62,#101827 70%)!important;min-height:100dvh} body.briefing canvas,body.briefing #ARButton,body.briefing #intro{display:none!important} body.briefing #missionBox{max-height:90dvh;bottom:12px!important} #portrait{display:none} body.briefing #portrait{display:block;width:100%;height:32dvh;object-fit:contain;margin:auto;filter:drop-shadow(0 0 15px #eac36b55)}
</style>
  <script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
  </script>
</head>

<body>
<div id="intro">
  <h2>SH AI 트레저헌터</h2>
  <p>AR 시작 후 안전한 곳에 멈춰 바닥을 비춰주세요.</p><a href="/?return=1" style="color:white">메인으로 돌아가기</a>
</div>
<div id="discovery">✦ 비밀요원 발견! ✦<div style="font-size:13px">SECRET AGENT DISCOVERED</div></div>
<img id="portrait" src="/file_0000000066c4820993aec93e7bd3b30c.png" alt="SH 비밀요원">
<div id="missionBox" style="
  display:none;
  position:fixed;
  bottom:12%;
  left:5%;
  width:90%;
  box-sizing:border-box;
  background:rgba(10,20,40,0.92);
  color:white;
  padding:20px;
  border:2px solid #00e5ff;
  border-radius:20px;
  z-index:9999;
  box-shadow:0 0 25px #00e5ff66;
">
  <div style="color:#00e5ff;font-size:12px;letter-spacing:3px;">
    ◆ SH 비밀요원 · 비밀 교신
  </div>
  <h3 style="color:#ffd700;">
    ✦ 새로운 퀘스트
  </h3>
  <p id="npcDialogue" aria-live="polite"></p>
  <button id="startMission" style="
  width:100%;
  padding:15px;
  margin-top:10px;
  background:#00e5ff;
  color:#101827;
  border:none;
  border-radius:12px;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
">
  좋아! 다음 이야기를 들려줘 ▶
  </button>
</div>
<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

import { ARButton } from
'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/webxr/ARButton.js';
import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';
const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 3));
const camera = new THREE.PerspectiveCamera(
  70, innerWidth / innerHeight, 0.01, 20
);

const renderer = new THREE.WebGLRenderer({
  alpha: true,
  antialias: true
});

renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
renderer.xr.addEventListener('sessionstart', () => {
  document.getElementById('intro').style.display = 'none'; document.body.style.background='transparent';
});

renderer.xr.addEventListener('sessionend', () => {
  if(briefingTransition)return;
  document.getElementById('intro').style.display = 'block';
  document.getElementById('missionBox').style.display = 'none'; document.body.style.background='#101827';
});
document.body.appendChild(renderer.domElement);

document.body.appendChild(
  ARButton.createButton(renderer, {
    requiredFeatures: ['hit-test'],
optionalFeatures: ['dom-overlay'],
domOverlay: { root: document.body }
  })
);

const ring = new THREE.Mesh(
  new THREE.RingGeometry(0.12, 0.15, 32)
    .rotateX(-Math.PI / 2),
  new THREE.MeshBasicMaterial({
    color: 0x00ff88
  })
);

ring.matrixAutoUpdate = false;
ring.visible = false;
scene.add(ring);

let hitSource = null;
let requested = false;
let characterSpawned = false;
let activeCharacter = null;
const controller = renderer.xr.getController(0);
let briefingTransition = false;
let approach = null, phase = 'search', idleAsset = null, walkAsset = null, activeMixer = null, generation = 0;
const loader = new GLTFLoader();
const ray = new THREE.Raycaster();
const cameraPos = new THREE.Vector3();
const sparks = new THREE.Group(); scene.add(sparks);
const sparkGeo = new THREE.SphereGeometry(.012, 6, 6);
for(let i=0;i<32;i++){const m=new THREE.Mesh(sparkGeo,new THREE.MeshBasicMaterial({color:0xffd879,transparent:true})); sparks.add(m);}
sparks.visible=false;
let sparkleTime=0, audio=null;
function footstep(){try{if(!audio || audio.state!=='running')return; const b=audio.createBuffer(1,Math.floor(audio.sampleRate*.13),audio.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/d.length*7);const src=audio.createBufferSource(),f=audio.createBiquadFilter(),g=audio.createGain();src.buffer=b;f.type='lowpass';f.frequency.value=650;g.gain.value=.16;src.connect(f).connect(g).connect(audio.destination);src.start();}catch(e){}}
function speak(text, target, done){
  const el=document.getElementById(target); if(el)el.textContent=text;
  if(!window.speechSynthesis){done?.();return;}
  const synth=window.speechSynthesis; synth.cancel();
  const u=new SpeechSynthesisUtterance(text);u.lang='ko-KR';u.rate=.96;u.pitch=1.0;u.volume=1;
  const voices=synth.getVoices().filter(v=>/^ko/i.test(v.lang));
  const voice=voices.find(v=>/natural|neural|premium/i.test(v.name))||voices.find(v=>/google/i.test(v.name))||voices[0];if(voice)u.voice=voice;
  let finished=false;const finish=()=>{if(finished)return;finished=true;done?.();};u.onend=finish;u.onerror=finish;synth.speak(u);setTimeout(finish,Math.max(4500,text.length*230));
}
function setModel(asset, mode){
 if(!asset)return;const old=activeCharacter;const model=asset.scene;
 if(old){model.position.copy(old.position);model.rotation.copy(old.rotation);model.scale.copy(old.scale);scene.remove(old);}
 mixers.forEach(m=>m.stopAllAction());mixers.length=0;scene.add(model);activeCharacter=model;
 const clips=asset.animations;const clip=clips.find(c=>mode==='walk'?/walk/i.test(c.name):/idle|stand/i.test(c.name))||clips[0];
 if(clip){activeMixer=new THREE.AnimationMixer(model);mixers.push(activeMixer);activeMixer.clipAction(clip).reset().play();}
}
loader.load('./sh_idle.glb',g=>{idleAsset=g;if(phase==='ready'&&activeCharacter)setModel(g,'idle');},undefined,()=>{});
function faceViewer(){if(!activeCharacter)return;const p=cameraPos.clone();p.y=activeCharacter.position.y;activeCharacter.lookAt(p);}
let typingTimer=null, dialogueStep=0;
function tone(freq,at,duration,volume=.055,type='sine'){if(!audio||audio.state!=='running')return;const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.001,at);g.gain.exponentialRampToValueAtTime(volume,at+.025);g.gain.exponentialRampToValueAtTime(.001,at+duration);o.connect(g).connect(audio.destination);o.start(at);o.stop(at+duration+.02);}
function fanfare(){try{const t=audio.currentTime;[130.81,196,261.63].forEach(f=>tone(f,t,.55,.065,'triangle'));[523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,t+i*.13,.65,.065,'triangle'));[523.25,659.25,783.99,1046.5].forEach(f=>tone(f,t+.52,.85,.045));}catch(e){}}
function discover(){const el=document.getElementById('discovery');el.classList.remove('on');void el.offsetWidth;el.classList.add('on');sparks.position.copy(activeCharacter.position);sparkleTime=1.3;sparks.visible=true;fanfare();}
function typeLine(text,target){clearInterval(typingTimer);const el=document.getElementById(target);if(!el)return;el.textContent='';let i=0;const chars=Array.from(text);typingTimer=setInterval(()=>{if(i>=chars.length){clearInterval(typingTimer);return;}el.textContent+=chars[i++];if(i%4===0&&audio?.state==='running')tone(660,audio.currentTime,.045,.018,'triangle');},32);}
const lines=['오호! 드디어 나를 찾아냈군! 꽤 대단한 탐험대인데?','쉿! 보물의 비밀을 풀 특별한 임무가 있어. 팀원들과 함께 도전해 볼래?'];
function dialogue(){const btn=document.getElementById('startMission');btn.textContent=dialogueStep===0?'물론이지! 계속 이야기해 줘 ▶':'좋아! 비밀 임무를 맡겨줘! ▶';typeLine(lines[dialogueStep],'npcDialogue');speak(lines[dialogueStep],'');}
async function showBrief(){
 if(briefingTransition)return;
 briefingTransition=true;phase='brief';approach=null;
 if(activeCharacter)activeCharacter.visible=false;
 sparks.visible=false;
 try{const session=renderer.xr.getSession();if(session)await session.end();}catch(e){briefingTransition=false;alert('AR 종료에 실패했습니다. 다시 시도해주세요.');return;}
 document.body.classList.add('briefing');document.body.style.background='#101827';
 document.getElementById('intro').style.display='none';
 const box=document.getElementById('missionBox');box.style.display='block';box.classList.add('open');dialogueStep=0;dialogue();
}



function spawnCharacter(){
 if(!ring.visible||characterSpawned)return;characterSpawned=true;const epoch=generation;
 const position=new THREE.Vector3().setFromMatrixPosition(ring.matrix);
 const ready=g=>{if(epoch!==generation)return;walkAsset=g;setModel(idleAsset||g,'idle');activeCharacter.position.copy(position);activeCharacter.scale.setScalar(.5);faceViewer();phase='ready';sparks.position.copy(position);sparkleTime=1.3;sparks.visible=true;};
 if(walkAsset)ready(walkAsset);else loader.load('./sh-character.glb',ready,undefined,()=>{if(epoch===generation)characterSpawned=false;});
}
controller.addEventListener('select',()=>{
 if(phase!=='ready'||!activeCharacter)return;
 controller.updateMatrixWorld(true);ray.setFromXRController ? ray.setFromXRController(controller) : (ray.ray.origin.setFromMatrixPosition(controller.matrixWorld),ray.ray.direction.set(0,0,-1).transformDirection(controller.matrixWorld));
 if(!ray.intersectObject(activeCharacter,true).length)return;
 try{audio ||= new (window.AudioContext||window.webkitAudioContext)();audio.resume();}catch(e){}
 discover();phase='approach';const from=activeCharacter.position.clone(),to=cameraPos.clone();to.y=from.y;
 const distance=from.distanceTo(to);if(distance<.12){showBrief();return;}const direction=to.clone().sub(from).normalize();to.addScaledVector(direction,.35);
 if(walkAsset)setModel(walkAsset,'walk');faceViewer();approach={from,to,elapsed:0,step:-1};
});
scene.add(controller);
const mixers = [];
const clock = new THREE.Clock();
renderer.setAnimationLoop((time, frame) => {
  const delta = clock.getDelta();
mixers.forEach(mixer => mixer.update(delta));
 if(frame){const xrCam=renderer.xr.getCamera();xrCam.getWorldPosition(cameraPos);}
 if(approach&&activeCharacter){approach.elapsed+=Math.min(delta,.1);const t=Math.min(1,approach.elapsed/2);activeCharacter.position.lerpVectors(approach.from,approach.to,t);faceViewer();const step=Math.floor(approach.elapsed/.42);if(step!==approach.step){approach.step=step;footstep();}if(t>=1){approach=null;showBrief();}}
 if(sparkleTime>0){sparkleTime-=delta;const t=1-Math.max(0,sparkleTime)/1.3;sparks.children.forEach((m,i)=>{const a=i*2.399+t*2;m.position.set(Math.cos(a)*(.15+t*.45),.05+t*.7+(i%5)*.05,Math.sin(a)*(.15+t*.45));m.material.opacity=1-t;});if(sparkleTime<=0)sparks.visible=false;}

  if (frame) {
    const session = renderer.xr.getSession();
    const space = renderer.xr.getReferenceSpace();

    if (!requested) {
      requested = true;

      session.requestReferenceSpace('viewer')
        .then(viewer => session.requestHitTestSource({
          space: viewer
        }))
        .then(source => {
          hitSource = source;
        })
        .catch(console.error);

      session.addEventListener('end', () => {
        requested = false;
        hitSource = null; generation++; approach=null; phase='search'; characterSpawned=false; if(activeCharacter)scene.remove(activeCharacter);activeCharacter=null;mixers.forEach(m=>m.stopAllAction());mixers.length=0;sparks.visible=false;window.speechSynthesis?.cancel();
        ring.visible = false;
      }, { once: true });
    }

    if (hitSource) {
      const results = frame.getHitTestResults(hitSource);

      if (results.length) {
        const pose = results[0].getPose(space);
        ring.visible = !!pose;

        if (pose) {
          ring.matrix.fromArray(pose.transform.matrix);
          spawnCharacter();
ring.visible = false;
        }
      } else {
        ring.visible = false;
      }
    }
  }

  renderer.render(scene, camera);
});
  const startButton = document.getElementById('startMission');
const originalBox = document.getElementById('missionBox');
const originalNodes=Array.from(originalBox.childNodes);
renderer.xr.addEventListener('sessionend',()=>{if(briefingTransition)return;clearInterval(typingTimer);originalBox.replaceChildren(...originalNodes);startButton.disabled=false;originalBox.classList.remove('open');document.getElementById('discovery').classList.remove('on');});

document.getElementById('missionBox').addEventListener('beforexrselect',e=>e.preventDefault());
startButton.addEventListener('beforexrselect', (event) => {
  event.preventDefault();
});

startButton.addEventListener('click', async () => {
  if(dialogueStep===0){dialogueStep=1;dialogue();return;}
  startButton.disabled=true;
  try {
    const response = await fetch('/api/config');
    if (!response.ok) throw new Error('API 오류');
    const data = await response.json();

    const missionId = Number(
      new URLSearchParams(location.search).get('mission') || 1
    );

    const mission = data.missions.find(
      m => m.id === missionId
    );

    if (!mission) throw new Error('미션 없음');

    const box = document.getElementById('missionBox');

    box.replaceChildren();
    const resultPanel=document.createElement('div');
    box.appendChild(resultPanel);
    resultPanel.innerHTML = `
      <h3 style="color:#ffd700;">✦ 비밀 퀘스트 ${missionId}</h3>
      <h2 id="missionTitle"></h2>
      <p id="missionText"></p><input id="answer" placeholder="요원에게 답을 알려줘!" style="width:90%;padding:12px"><button id="submitAnswer">임무 결과 전송 ▶</button><p id="answerStatus"></p>
    `;

    document.getElementById('missionTitle').textContent = mission.title;
    typeLine(mission.description,'missionText');

    document.getElementById('submitAnswer').addEventListener('click',async()=>{const btn=document.getElementById('submitAnswer');btn.disabled=true;try{const r=await fetch('/api/submit',{method:'POST',headers:{'Content-Type':'application/json','x-team-token':localStorage.getItem('sh_treasure_token')||''},body:JSON.stringify({mission:missionId,answer:document.getElementById('answer').value})});const result=await r.json();if(!r.ok)throw Error(result.error);await renderer.xr.getSession()?.end();location.href='/?return=1';}catch(e){document.getElementById('answerStatus').textContent=e.message;btn.disabled=false;}});
    speak(mission.title + '. ' + mission.description, '');

  } catch (error) {
    startButton.disabled=false;alert('미션을 불러오지 못했습니다.');
  }
});
</script>
</body>
</html>
