<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>황금섬의 비밀</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#24365b,#070e20 65%);color:#fff;font:16px system-ui;min-height:100vh}main{max-width:650px;margin:auto;padding:20px}h1,h2{color:#ffe1a0}small{color:#b9c9df}button{font:inherit;color:white;background:#243958;border:1px solid #829bb9;border-radius:12px;padding:12px;cursor:pointer}button:disabled{opacity:.5}.gold{background:linear-gradient(120deg,#ffe5a0,#b77c25);color:#172039;font-weight:bold;width:100%}.deck{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.mission{position:relative;overflow:hidden;min-height:190px;background:linear-gradient(145deg,#101b38,var(--c),#101b38);border:2px solid transparent;background-clip:padding-box;box-shadow:0 0 0 1px #b5d9ff,0 0 18px #8acaff33;text-align:center}.mission:before{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 25%,#aaffff44 40%,#ff9bff55 48%,#ffffa544 55%,transparent 70%);transform:translateX(-100%);animation:shine 5s infinite;pointer-events:none}@keyframes shine{50%,100%{transform:translateX(100%)}}.mission.done{filter:grayscale(1)}.symbol{font-size:48px;display:block;margin:12px}.gems{display:flex;justify-content:space-between;font-size:23px;margin:16px 0}.gem{color:#657083}.gem.on{color:#ffd66c;text-shadow:0 0 12px gold}.panel{padding:18px;border:1px solid #a88a52;border-radius:20px;background:#111e36;margin:15px 0}.board{display:grid;gap:5px;margin:14px auto;max-width:420px}.board button{padding:0;aspect-ratio:1;font-size:25px;min-width:0}.selected{outline:3px solid gold}.hidden{display:none!important}input{width:100%;padding:14px;border-radius:10px;font:inherit;margin:10px 0}#status{min-height:28px;color:#ffe0a0}#intro{text-align:center;padding:12vh 0}#intro .symbol{font-size:100px} @media(prefers-reduced-motion:reduce){*{animation:none!important}}
body{background:radial-gradient(ellipse at top,#244f54,#081b29 70%)}.hero{font-size:80px;text-align:center}.map{position:relative;background:radial-gradient(ellipse at 45% 45%,#486c49,#203e39 65%,#0b293c 66%);border:2px solid #b8a16a;border-radius:45% 38% 40% 35%;height:540px;overflow:hidden}.node{position:absolute;transform:translate(-50%,-50%);width:65px;height:65px;border-radius:50%;padding:3px;font-size:22px;background:#142c35;z-index:2}.node small{display:block;font-size:10px}.node.active{border:3px solid gold;box-shadow:0 0 20px gold}.node:disabled{opacity:.65;background:#16242b}.maze{display:grid;gap:1px;background:#07131c;padding:4px;margin:auto;max-width:460px;touch-action:none}.cell{aspect-ratio:1;background:#355d57;display:grid;place-items:center;font-size:clamp(8px,3vw,20px)}.wall{background:#101c28}.trail{background:#8c7850}.controls{display:grid;grid-template-columns:repeat(3,64px);justify-content:center;gap:5px;margin:15px}.controls button{padding:10px}.modes{display:grid;gap:10px}.modes button{text-align:left}.map svg{position:absolute;width:100%;height:100%;inset:0}.tag{letter-spacing:3px;color:#c8b37a}button:focus-visible{outline:3px solid gold}</style><main><section id="intro"><div class="tag">AI TREASURE HUNTER</div><div class="hero">🏝️</div><h1>잃어버린 황금섬의 비밀</h1><p>지도는 고대 미로 너머에 잠들어 있다. 길을 찾고 열 개의 보석을 모아라.</p><div class="modes"><button class="gold" onclick="setup()">🧭 개인 탐험 시작</button><button disabled>🤝 협동 탐험 · 서버 개발 예정</button><button disabled>🏁 경쟁 탐험 · 서버 개발 예정</button></div><p id="resume"></p></section><section id="setup" class="hidden"><h1>탐험 난이도</h1><div class="modes"><button onclick="newRun(0)">초급 · 루키 탐험가</button><button onclick="newRun(1)">중급 · 전문 탐험가</button><button onclick="newRun(2)">고급 · 마스터 헌터</button></div></section><section id="hub" class="hidden"><small>황금섬 탐험 지도</small><h1>보물의 길</h1><div id="gems" class="gems"></div><p id="progress"></p><div id="map" class="map"></div><p id="next"></p><button class="gold" id="go" onclick="travel()">다음 장소로 이동</button><button onclick="show('intro')">메인으로</button></section><section id="play" class="hidden"><button onclick="leave()">← 돌아가기</button><h2 id="title"></h2><p id="guide"></p><div id="game" class="panel"></div><p id="status" role="status"></p></section></main><script>const $=id=>document.getElementById(id), names=['패턴의 비밀','관찰의 달인','암호 해독 연구소','컬러 사이언스','기억력 챌린지','숨겨진 단서','공간의 법칙','추리 탐정사무소','지도의 비밀','최후의 두뇌 챌린지'],icons=['💎','🔍','🔐','🔮','🧠','🧭','🧩','📁','🗺️','🏆'],places=['수정 동굴','환상의 숲','비밀 도서관','마법의 탑','기억의 신전','난파선','무너진 다리','비밀 저택','별빛 전망대','황금 신전'];let level=1,done=[],mapped=false,current=-1,epoch=0,moveMaze=null;const key='treasure-home-v2';function save(){try{localStorage.setItem(key,JSON.stringify({level,done,mapped}))}catch{}}try{let x=JSON.parse(localStorage.getItem(key));if(x&&[0,1,2].includes(x.level)&&Array.isArray(x.done)){level=x.level;done=x.done;mapped=!!x.mapped;$('resume').innerHTML='<button onclick="resume()">이전 탐험 이어하기</button>'}}catch{}function show(id){epoch++;moveMaze=null;for(let x of ['intro','setup','hub','play'])$(x).classList.toggle('hidden',x!==id)}function setup(){show('setup')}function newRun(l){if((mapped||done.length)&&!confirm('새 탐험을 시작하면 이전 진행 기록이 초기화됩니다.'))return;level=l;done=[];mapped=false;save();prologue()}function resume(){mapped?hub():prologue()}function leave(){mapped?hub():show('intro')}function stage(t,g){show('play');$('title').textContent=t;$('guide').textContent=g;$('status').textContent='';$('game').innerHTML=''}function prologue(){stage('프롤로그 · 잊혀진 미로','방향키로 탐험가를 움직여 지도 금고까지 도착하세요.');maze([9,15,21][level],vault)}function vault(){stage('고대 지도 금고','수열의 규칙을 찾아 금고를 열어보세요.');question(['3, 6, 12, 24, ?','2, 6, 12, 20, 30, ?','1, 2, 6, 24, 120, ?'][level],['48','42','720'][level],()=>{mapped=true;save();$('game').innerHTML='<div class="hero">🗺️</div><h2>보물지도 획득!</h2><button class="gold" onclick="hub()">황금섬 탐험 시작</button>'})}function question(q,a,ok){$('guide').textContent=q;$('game').innerHTML='<input id="answer" placeholder="정답 입력" autocomplete="off"><button class="gold" id="check">금고 해독</button>';$('check').onclick=()=>{if($('answer').value.trim().replace(/\s/g,'').toLowerCase()===a)ok();else $('status').textContent='다시 단서를 살펴보세요.'}}function maze(n,finish){let a=Array(n*n).fill(1),p=n+1,goal=(n-2)*n+n-2;function carve(i){a[i]=0;for(let d of shuffle([-2*n,2*n,-2,2])){let j=i+d,r=Math.floor(j/n),c=j%n;if(r>0&&r<n-1&&c>0&&c<n-1&&Math.abs(c-i%n)<=2&&a[j]){a[(i+j)/2]=0;carve(j)}}}carve(p);let seen=new Set([p]);let b=document.createElement('div');b.className='maze';b.style.gridTemplateColumns=`repeat(${n},1fr)`;$('game').append(b);let cells=a.map(()=>{let e=document.createElement('div');b.append(e);return e});function draw(){cells.forEach((e,i)=>{e.className='cell '+(a[i]?'wall':seen.has(i)?'trail':'');e.textContent=i===p?'🧭':i===goal?'◆':''})}moveMaze=d=>{let j=p+({up:-n,down:n,left:-1,right:1}[d]);if(a[j]!==0)return;p=j;seen.add(p);draw();if(p===goal){moveMaze=null;finish()}};let c=document.createElement('div');c.className='controls';for(let d of ['','up','','left','down','right']){let e=document.createElement(d?'button':'span');if(d){e.textContent={up:'↑',down:'↓',left:'←',right:'→'}[d];e.onclick=()=>moveMaze?.(d)}c.append(e)}$('game').append(c);draw()}document.addEventListener('keydown',e=>{let d={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'}[e.key];if(d&&moveMaze){e.preventDefault();moveMaze(d)}});const coords=[[24,86],[65,80],[78,65],[43,66],[22,51],[57,48],[80,34],[43,31],[22,17],[64,13]];function hub(){show('hub');$('gems').innerHTML=names.map((_,i)=>`<span class="gem ${i<done.length?'on':''}">◆</span>`).join('');$('progress').textContent=`보석 ${done.length}/10 · ${done.length*100}점`;$('map').innerHTML=`<svg viewBox="0 0 100 100" preserveAspectRatio="none"><polyline points="${coords.map(x=>x.join(',')).join(' ')}" fill="none" stroke="#c8ae72" stroke-width=".7" stroke-dasharray="2 2"/></svg>`+coords.map(([x,y],i)=>`<button class="node ${i===done.length?'active':''}" style="left:${x}%;top:${y}%" ${i!==done.length?'disabled':''} onclick="travel()">${i<done.length?'💎':i===done.length?icons[i]:'🔒'}<small>${i<=done.length?places[i]:'미발견'}</small></button>`).join('');$('next').textContent=done.length===10?'황금 보물상자 획득! 탐험 완료':`다음 목적지: ${places[done.length]}`;$('go').hidden=done.length===10}function travel(){current=done.length;if(current>=10)return;stage(places[current]+' · 이동 경로','미로를 통과해 다음 장소를 발견하세요.');maze([7,9,13][level],()=>openGame(current))}function win(){if(current===done.length){done.push(current);save()}$('status').textContent='황금 보석 획득! 다음 장소 해금';$('game').innerHTML='<div class="hero">💎</div><button class="gold" onclick="hub()">지도 돌아가기</button>'}function openGame(i){current=i;stage(places[i]+' · '+names[i],'');if(i===0)match();else if(i===1)observe();else if(i===2)quiz(['U S F B T V S F — 각 글자를 한 칸 이전으로','W U H D V X U H — 각 글자를 세 칸 이전으로','H U X V D H U W — 순서를 뒤집고 각 글자를 세 칸 이전으로'][level],'treasure');else if(i===4)memory();else if(i===5)hidden();else if(i===8)slide();else if(i===7)quiz('세 상자 중 하나에 열쇠가 있다. A: B에 있다. B: C에 없다. C: A에 없다. 진술 중 정확히 하나만 참이다. 열쇠는 A, B, C 중 어디에 있는가?','a');else if(i===9)quiz('최종 금고: 1, 4, 10, 22, 46, ? (숫자만 입력)','94');else if(i===3)lights();else blocks()}function lights(){let n=[3,4,5][level],a=Array(n*n).fill(0);function flip(i){for(let j of [i,i-n,i+n,...(i%n?[i-1]:[]),...(i%n<n-1?[i+1]:[])])if(j>=0&&j<a.length)a[j]^=1}for(let i=0;i<n+2;i++)flip(Math.random()*a.length|0);if(!a.some(Boolean))flip(0);$('guide').textContent='구슬을 누르면 자신과 상하좌우의 빛이 바뀝니다. 모든 빛을 끄세요.';function draw(){board(n,a.map(x=>x?'🟡':'⚫'),i=>{flip(i);if(a.every(x=>!x))win();else draw()})}draw()}function blocks(){let n=[3,4,5][level],a=Array.from({length:n*n},(_,i)=>(i+1)%(n*n)),z=a.length-1;function near(i){return Math.abs(i-z)===n||(Math.floor(i/n)===Math.floor(z/n)&&Math.abs(i-z)===1)}for(let k=0;k<n*8;k++){let opts=a.map((_,i)=>i).filter(near),j=opts[Math.random()*opts.length|0];[a[z],a[j]]=[a[j],a[z]];z=j}$('guide').textContent='빈칸을 이용해 숫자 블록을 순서대로 배치하세요.';function draw(){board(n,a.map(x=>x||' '),i=>{if(!near(i))return;[a[z],a[i]]=[a[i],a[z]];z=i;if(a.every((x,j)=>x===(j+1)%a.length))win();else draw()})}draw()}function board(n,items,fn){$('game').innerHTML='';const b=document.createElement('div');b.className='board';b.style.gridTemplateColumns=`repeat(${n},1fr)`;items.forEach((v,i)=>{const x=document.createElement('button');x.textContent=v;x.onclick=()=>fn(i,x);b.append(x)});$('game').append(b);return b}function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function quiz(q,a){$('guide').textContent=q;$('game').innerHTML='<input id="answer" autocomplete="off" placeholder="정답 입력"><button class="gold" id="check">정답 확인</button>';$('check').onclick=()=>{if($('answer').value.trim().replace(/\s/g,'').toLowerCase()===a)win();else $('status').textContent='다시 생각해 보세요.'}}function match(){let a=[],sel=-1,total=0,sy=['🔴','🔷','🟢','🟡','🟣'];const rnd=()=>sy[Math.random()*5|0];for(let i=0;i<36;i++){let v;do{v=rnd()}while((i%6>1&&a[i-1]===v&&a[i-2]===v)||(i>=12&&a[i-6]===v&&a[i-12]===v));a.push(v)}function hits(){let s=new Set;for(let i=0;i<36;i++){if(i%6<4&&a[i]===a[i+1]&&a[i]===a[i+2])[i,i+1,i+2].forEach(x=>s.add(x));if(i<24&&a[i]===a[i+6]&&a[i]===a[i+12])[i,i+6,i+12].forEach(x=>s.add(x))}return s}function draw(){$('guide').textContent=`인접한 보석을 교환해 같은 보석 3개 이상을 연결하세요. ${total}/${[30,60,90][level]}`;let b=board(6,a,(i)=>{if(sel<0){sel=i;draw();return}let j=sel;sel=-1;if(!(Math.abs(i-j)===6||(Math.floor(i/6)===Math.floor(j/6)&&Math.abs(i-j)===1))){draw();return}[a[i],a[j]]=[a[j],a[i]];let h=hits();if(!h.size){[a[i],a[j]]=[a[j],a[i]];$('status').textContent='세 개가 연결되는 교환을 찾아보세요.'}else{while(h.size){total+=h.size;for(let c=0;c<6;c++){let col=[];for(let r=5;r>=0;r--)if(!h.has(r*6+c))col.push(a[r*6+c]);while(col.length<6)col.push(rnd());for(let r=5;r>=0;r--)a[r*6+c]=col[5-r]}h=hits()}if(total>=[30,60,90][level]){win();return}}draw()});if(sel>=0)b.children[sel].classList.add('selected');let reset=document.createElement('button');reset.textContent='보석 재배치';reset.onclick=()=>{match()};$('game').append(reset)}draw()}
function observe(){let a=Array.from({length:16},(_,i)=>['🌴','🐚','⭐','🪨'][i%4]),b=a.slice(),diff=shuffle([...a.keys()]).slice(0,[5,8,12][level]),found=new Set;diff.forEach(i=>b[i]='💎');$('guide').textContent='위와 아래 그림 배열에서 달라진 부분을 아래쪽에서 선택하세요.';function draw(){let top=board(4,a,()=>{});let bottom=document.createElement('div');bottom.className='board';bottom.style.gridTemplateColumns='repeat(4,1fr)';b.forEach((v,i)=>{let x=document.createElement('button');x.textContent=v;x.disabled=found.has(i);x.onclick=()=>{if(diff.includes(i)){found.add(i);if(found.size===diff.length)win();else draw()}else $('status').textContent='같은 그림입니다.'};bottom.append(x)});$('game').append(bottom);$('status').textContent=`${found.size}/${diff.length} 발견`}draw()}
function memory(){let a=shuffle([...icons.slice(0,8),...icons.slice(0,8)]),found=new Set,first=-1,lock=false,e=epoch;$('guide').textContent='카드를 두 장씩 뒤집어 같은 그림 8쌍을 찾으세요.';let b=board(4,a.map(()=>'?'),(i,x)=>{if(lock||found.has(i)||i===first)return;x.textContent=a[i];if(first<0){first=i;return}let j=first;first=-1;if(a[i]===a[j]){found.add(i);found.add(j);if(found.size===16)win()}else{lock=true;setTimeout(()=>{if(e!==epoch)return;b.children[i].textContent='?';b.children[j].textContent='?';lock=false},650)}})}function hidden(){let a=shuffle([...Array(25).fill('🌿'),...Array(5).fill('🔑'),...Array(6).fill('🍀')]),n=0;$('guide').textContent='풀숲 속 열쇠 5개를 찾아 선택하세요.';board(6,a,(i,x)=>{if(a[i]==='🔑'&&!x.disabled){x.disabled=true;x.textContent='✓';if(++n===5)win()}else $('status').textContent='열쇠를 찾아보세요.'})}function slide(){let a=[1,2,3,4,5,6,7,8,0],z=8;for(let k=0;k<35;k++){let opts=a.map((_,i)=>i).filter(i=>Math.abs(i-z)===3||(Math.floor(i/3)===Math.floor(z/3)&&Math.abs(i-z)===1));let j=opts[Math.random()*opts.length|0];[a[z],a[j]]=[a[j],a[z]];z=j}$('guide').textContent='빈칸 옆 숫자를 움직여 1부터 8까지 순서대로 배열하세요.';function draw(){board(3,a.map(x=>x||' '),(i)=>{if(Math.abs(i-z)===3||(Math.floor(i/3)===Math.floor(z/3)&&Math.abs(i-z)===1)){[a[z],a[i]]=[a[i],a[z]];z=i;if(a.join(',')==='1,2,3,4,5,6,7,8,0')win();else draw()}})}draw()}
