<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 트레저헌터 HOME</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#24365b,#070e20 65%);color:#fff;font:16px system-ui;min-height:100vh}main{max-width:650px;margin:auto;padding:20px}h1,h2{color:#ffe1a0}small{color:#b9c9df}button{font:inherit;color:white;background:#243958;border:1px solid #829bb9;border-radius:12px;padding:12px;cursor:pointer}button:disabled{opacity:.5}.gold{background:linear-gradient(120deg,#ffe5a0,#b77c25);color:#172039;font-weight:bold;width:100%}.deck{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.mission{position:relative;overflow:hidden;min-height:190px;background:linear-gradient(145deg,#101b38,var(--c),#101b38);border:2px solid transparent;background-clip:padding-box;box-shadow:0 0 0 1px #b5d9ff,0 0 18px #8acaff33;text-align:center}.mission:before{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 25%,#aaffff44 40%,#ff9bff55 48%,#ffffa544 55%,transparent 70%);transform:translateX(-100%);animation:shine 5s infinite;pointer-events:none}@keyframes shine{50%,100%{transform:translateX(100%)}}.mission.done{filter:grayscale(1)}.symbol{font-size:48px;display:block;margin:12px}.gems{display:flex;justify-content:space-between;font-size:23px;margin:16px 0}.gem{color:#657083}.gem.on{color:#ffd66c;text-shadow:0 0 12px gold}.panel{padding:18px;border:1px solid #a88a52;border-radius:20px;background:#111e36;margin:15px 0}.board{display:grid;gap:5px;margin:14px auto;max-width:420px}.board button{padding:0;aspect-ratio:1;font-size:25px;min-width:0}.selected{outline:3px solid gold}.hidden{display:none!important}input{width:100%;padding:14px;border-radius:10px;font:inherit;margin:10px 0}#status{min-height:28px;color:#ffe0a0}#intro{text-align:center;padding:12vh 0}#intro .symbol{font-size:100px} @media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style><main><section id="intro"><small>AI TREASURE HUNTER · HOME</small><div class="symbol">💎</div><h1>두뇌 탐험대</h1><p>잃어버린 황금섬의 비밀</p><p>10가지 두뇌 미션을 해결하고 황금 보물상자를 열어보세요.</p><button class="gold" onclick="start()">탐험 시작 / 이어하기</button></section><section id="hub" class="hidden"><small>AI TREASURE HUNTER · HOME</small><h1>두뇌 탐험대</h1><div id="gems" class="gems"></div><p id="progress"></p><div id="deck" class="deck"></div><div id="reward" class="panel hidden"><h2>🏆 황금 보물상자 획득!</h2><p>두뇌 탐험대 10개 미션 완료</p></div></section><section id="play" class="hidden"><button onclick="hub()">← 탐험 지도</button><h2 id="title"></h2><p id="guide"></p><div id="game" class="panel"></div><p id="status" role="status"></p></section></main><script>
const names=['패턴의 비밀','관찰의 달인','암호 해독 연구소','컬러 사이언스','기억력 챌린지','숨겨진 단서','공간의 법칙','추리 탐정사무소','지도의 비밀','최후의 두뇌 챌린지'];const icons=['💎','🔍','🔐','🔮','🧠','🧭','🧩','📁','🗺️','🏆'];const skills=['패턴 인식','관찰력','논리적 사고','공간지각','기억력','탐구력','공간구성','문제해결','공간적 사고','종합 사고'];const colors=['#493d92','#14675c','#783b72','#235b92','#785324','#375b80','#714346','#40578a','#3e7062','#87632c'];const $=id=>document.getElementById(id);let done=[];try{done=JSON.parse(localStorage.getItem('treasure-home-v1')||'[]');if(!Array.isArray(done))done=[]}catch{}let current=-1,epoch=0;function start(){hub()}function hub(){epoch++;$('intro').classList.add('hidden');$('play').classList.add('hidden');$('hub').classList.remove('hidden');$('gems').innerHTML=names.map((_,i)=>`<span class="gem ${done.includes(i)?'on':''}">◆</span>`).join('');$('progress').textContent=`보석 ${done.length} / 10 · ${done.length*100}점`;$('deck').innerHTML=names.map((n,i)=>`<button class="mission ${done.includes(i)?'done':''}" style="--c:${colors[i]}" onclick="openGame(${i})"><small>MISSION ${String(i+1).padStart(2,'0')}</small><span class="symbol">${icons[i]}</span><b>${n}</b><br><small>${skills[i]}${done.includes(i)?' · 완료':''}</small></button>`).join('');$('reward').classList.toggle('hidden',done.length!==10)}function win(){if(!done.includes(current)){done.push(current);try{localStorage.setItem('treasure-home-v1',JSON.stringify(done))}catch{}}$('status').textContent='미션 성공! 황금 보석 획득';$('game').innerHTML='<div style="text-align:center;font-size:64px">💎</div><button class="gold" onclick="hub()">보석 수집 완료</button>'}function board(n,items,fn){$('game').innerHTML='';const b=document.createElement('div');b.className='board';b.style.gridTemplateColumns=`repeat(${n},1fr)`;items.forEach((v,i)=>{const x=document.createElement('button');x.textContent=v;x.onclick=()=>fn(i,x);b.append(x)});$('game').append(b);return b}function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function quiz(q,a){$('guide').textContent=q;$('game').innerHTML='<input id="answer" autocomplete="off" placeholder="정답 입력"><button class="gold" id="check">정답 확인</button>';$('check').onclick=()=>{if($('answer').value.trim().replace(/\s/g,'').toLowerCase()===a)win();else $('status').textContent='다시 생각해 보세요.'}}function openGame(i){current=i;epoch++;$('hub').classList.add('hidden');$('play').classList.remove('hidden');$('title').textContent=names[i];$('status').textContent='';$('game').innerHTML='';if(i===0)match();else if(i===1)observe();else if(i===2)quiz('각 글자를 알파벳에서 한 칸 앞으로 되돌리세요. U S F B T V S F','treasure');else if(i===4)memory();else if(i===5)hidden();else if(i===8)slide();else if(i===7)quiz('열쇠는 빨강, 파랑, 초록 상자 중 하나에 있습니다. 빨강과 초록 상자는 비어 있습니다. 열쇠가 있는 상자의 색은?','파랑');else if(i===9)quiz('수열의 다음 수를 입력하세요. 2, 6, 12, 20, 30, ?','42');else {$('guide').textContent='이 미니게임은 다음 개발 단계에서 연결됩니다.';$('game').textContent='준비 중'}}
function match(){let a=[],sel=-1,total=0,sy=['🔴','🔷','🟢','🟡','🟣'];const rnd=()=>sy[Math.random()*5|0];for(let i=0;i<36;i++){let v;do{v=rnd()}while((i%6>1&&a[i-1]===v&&a[i-2]===v)||(i>=12&&a[i-6]===v&&a[i-12]===v));a.push(v)}function hits(){let s=new Set;for(let i=0;i<36;i++){if(i%6<4&&a[i]===a[i+1]&&a[i]===a[i+2])[i,i+1,i+2].forEach(x=>s.add(x));if(i<24&&a[i]===a[i+6]&&a[i]===a[i+12])[i,i+6,i+12].forEach(x=>s.add(x))}return s}function draw(){$('guide').textContent=`인접한 보석을 교환해 같은 보석 3개 이상을 연결하세요. ${total}/30`;let b=board(6,a,(i)=>{if(sel<0){sel=i;draw();return}let j=sel;sel=-1;if(!(Math.abs(i-j)===6||(Math.floor(i/6)===Math.floor(j/6)&&Math.abs(i-j)===1))){draw();return}[a[i],a[j]]=[a[j],a[i]];let h=hits();if(!h.size){[a[i],a[j]]=[a[j],a[i]];$('status').textContent='세 개가 연결되는 교환을 찾아보세요.'}else{while(h.size){total+=h.size;for(let c=0;c<6;c++){let col=[];for(let r=5;r>=0;r--)if(!h.has(r*6+c))col.push(a[r*6+c]);while(col.length<6)col.push(rnd());for(let r=5;r>=0;r--)a[r*6+c]=col[5-r]}h=hits()}if(total>=30){win();return}}draw()});if(sel>=0)b.children[sel].classList.add('selected');let reset=document.createElement('button');reset.textContent='보석 재배치';reset.onclick=()=>{match()};$('game').append(reset)}draw()}
function observe(){let a=Array.from({length:16},(_,i)=>['🌴','🐚','⭐','🪨'][i%4]),b=a.slice(),diff=shuffle([...a.keys()]).slice(0,5),found=new Set;diff.forEach(i=>b[i]='💎');$('guide').textContent='위와 아래 그림 배열에서 달라진 5곳을 아래쪽에서 선택하세요.';function draw(){let top=board(4,a,()=>{});let bottom=document.createElement('div');bottom.className='board';bottom.style.gridTemplateColumns='repeat(4,1fr)';b.forEach((v,i)=>{let x=document.createElement('button');x.textContent=v;x.disabled=found.has(i);x.onclick=()=>{if(diff.includes(i)){found.add(i);if(found.size===5)win();else draw()}else $('status').textContent='같은 그림입니다.'};bottom.append(x)});$('game').append(bottom);$('status').textContent=`${found.size}/5 발견`}draw()}
function memory(){let a=shuffle([...icons.slice(0,8),...icons.slice(0,8)]),found=new Set,first=-1,lock=false,e=epoch;$('guide').textContent='카드를 두 장씩 뒤집어 같은 그림 8쌍을 찾으세요.';let b=board(4,a.map(()=>'?'),(i,x)=>{if(lock||found.has(i)||i===first)return;x.textContent=a[i];if(first<0){first=i;return}let j=first;first=-1;if(a[i]===a[j]){found.add(i);found.add(j);if(found.size===16)win()}else{lock=true;setTimeout(()=>{if(e!==epoch)return;b.children[i].textContent='?';b.children[j].textContent='?';lock=false},650)}})}function hidden(){let a=shuffle([...Array(25).fill('🌿'),...Array(5).fill('🔑'),...Array(6).fill('🍀')]),n=0;$('guide').textContent='풀숲 속 열쇠 5개를 찾아 선택하세요.';board(6,a,(i,x)=>{if(a[i]==='🔑'&&!x.disabled){x.disabled=true;x.textContent='✓';if(++n===5)win()}else $('status').textContent='열쇠를 찾아보세요.'})}function slide(){let a=[1,2,3,4,5,6,7,8,0],z=8;for(let k=0;k<35;k++){let opts=a.map((_,i)=>i).filter(i=>Math.abs(i-z)===3||(Math.floor(i/3)===Math.floor(z/3)&&Math.abs(i-z)===1));let j=opts[Math.random()*opts.length|0];[a[z],a[j]]=[a[j],a[z]];z=j}$('guide').textContent='빈칸 옆 숫자를 움직여 1부터 8까지 순서대로 배열하세요.';function draw(){board(3,a.map(x=>x||' '),(i)=>{if(Math.abs(i-z)===3||(Math.floor(i/3)===Math.floor(z/3)&&Math.abs(i-z)===1)){[a[z],a[i]]=[a[i],a[z]];z=i;if(a.join(',')==='1,2,3,4,5,6,7,8,0')win();else draw()}})}draw()}
</script></html>
