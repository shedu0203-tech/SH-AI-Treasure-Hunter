<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SH AI 트레저헌터</title><style>body{font-family:system-ui,sans-serif;background:#081b31;color:#edf7ff;margin:0;padding:18px}main{max-width:1000px;margin:auto}header{padding:20px 0}h1{margin:4px 0}section,.tile{background:#163552;border:1px solid #315673;border-radius:16px;padding:17px;margin:12px 0}button,input,select{font:inherit;padding:12px;border-radius:10px;border:1px solid #6183a0;background:#244a6b;color:#fff;box-sizing:border-box}button{background:#63d4ca;color:#08263d;font-weight:700;cursor:pointer}button:disabled{opacity:.5}.danger{background:#ffb3b3}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.muted{color:#b9d0e4}small{color:#b9d0e4}.progress{background:#315673;border-radius:10px;overflow:hidden;height:12px}.bar{height:100%;background:#63d4ca}table{border-collapse:collapse;width:100%}td,th{padding:9px;border-bottom:1px solid #45627c;text-align:center}.scroll{overflow:auto}#msg{color:#8fe8d5;white-space:pre-wrap}label{display:block;margin:8px 0}</style></head><body><main><header><small>SH EDU COMPANY</small><h1>🧭 SH AI 트레저헌터</h1><p class="muted">수련원 전체가 하나의 보물지도가 된다!</p></header><div id="app">불러오는 중...</div><p id="msg"></p></main><script>
let cfg=null,session=JSON.parse(localStorage.getItem('sh_treasure_team')||'null'),state=null;
const el=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
async function request(url,body){const r=await fetch(url,{method:body?'POST':'GET',headers:{'Content-Type':'application/json','x-team-token':session?.token||''},body:body?JSON.stringify(body):undefined});const j=await r.json();if(!r.ok)throw Error(j.error);return j}
async function init(){try{cfg=await request('/api/config');if(session){try{state=(await request('/api/me')).team}catch{session=null;localStorage.removeItem('sh_treasure_team')}}render()}catch(e){el('msg').textContent=e.message}}
function render(){if(!state){el('app').innerHTML=`<section><h2>팀 등록</h2><label>우리 팀 <select id="team">${Array.from({length:40},(_,i)=>`<option value="${i+1}">${i+1}팀</option>`).join('')}</select></label><label>팀 이름 <input id="name" placeholder="예: 보물 탐험대"></label><button onclick="join()">탐험 시작</button></section>`;return}
const count=state.done.filter(Boolean).length;
el('app').innerHTML=`<section><h2>${esc(state.id)}팀 · ${esc(state.name)}</h2><p>완료 ${count}/8 · 점수 ${state.score}점</p><div class="progress"><div class="bar" style="width:${count/8*100}%"></div></div></section><div class="grid">${cfg.missions.map(m=>{const i=m.id-1,done=state.done[i],pending=state.pending.includes(m.id),locked=m.id===8&&!state.done.slice(0,7).every(Boolean);return `<div class="tile"><small>미션 ${m.id} · ${esc(m.place)}</small><h3>${esc(m.title)}</h3><p class="muted">${esc(m.description)}</p>${done?'✅ 완료':pending?'⏳ 지도자 승인 대기':locked?'🔒 앞의 7개 미션 완료 후 열림':!cfg.open?'⛔ 운영 종료':m.type==='approve'?`<button onclick="submit(${m.id})">지도자 승인 요청</button>`:`<input id="answer${m.id}" placeholder="현장 암호 입력" style="width:100%;margin-bottom:8px"><button onclick="submit(${m.id})">정답 제출</button>`}</div>`}).join('')}</div><section><button onclick="refresh()">진행 상황 새로고침</button></section>`}
async function join(){try{const j=await request('/api/join',{team:Number(el('team').value),name:el('name').value});session={token:j.token};localStorage.setItem('sh_treasure_team',JSON.stringify(session));state=j.team;render()}catch(e){el('msg').textContent=e.message}}
async function submit(i){try{const answer=el('answer'+i)?.value||'';state=(await request('/api/submit',{mission:i,answer})).team;el('msg').textContent='제출되었습니다.';render()}catch(e){el('msg').textContent=e.message}}
async function refresh(){try{state=(await request('/api/me')).team;cfg=await request('/api/config');render()}catch(e){el('msg').textContent=e.message}}
init();setInterval(()=>{if(session)refresh()},12000);
</script></body></html>
